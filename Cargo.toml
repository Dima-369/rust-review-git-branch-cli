[package]
name = "code-reviewer"
version = "0.2.0"
edition = "2024"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9.7"
tiktoken-rs = "0.9.1"
arboard = "3.4.0"
pathdiff = "0.2"
colored = "3"
regex = "1.12.2"
globset = "0.4"
path-clean = "1.0"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"
